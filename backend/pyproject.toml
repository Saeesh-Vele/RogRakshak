[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rograkshak-backend"
version = "0.1.0"
description = "Backend service for RogRakshak - HAI surveillance and outbreak investigation platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg2-binary",
    "pydantic>=2.0",
    "python-dotenv",
    "alembic",
    "neo4j",
    "langgraph",
    "langchain-google-genai",
    "reportlab",
    "pytest",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
